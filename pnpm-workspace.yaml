allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  workerd: true

blockExoticSubdeps: true

trustPolicy: "no-downgrade"

strictDepBuilds: true

minimumReleaseAge: 10080

overrides:
  # GHSA-g3hv-75wg-m249 (globparts DoS), fixed in 11.0.1. Consumers
  # (@eslint/config-array, @typescript-eslint/typescript-estree) cap at ^10,
  # so they can't float to the patched line on their own. 11.0.8 is the
  # newest 11.x past minimumReleaseAge; 11.0.7+ also clears the v11.0.0
  # quadratic-compile regression (GHSA-cf2h-pxjq-68xw).
  minimatch: 11.0.9
