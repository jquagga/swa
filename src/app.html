<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Simple Weather</title>
	<meta name="description" content="Simple Weather App queries the US National Weather Service to provide a responsive, mobile-friendly weather forecast." />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg">
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-title" content="Simple Weather">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta property="og:title" content="Simple Weather App">
	<meta property="og:description"
		content="A website which pulls the US NWS weather forecast for your location in a mobile friendly format.">
	<meta property="og:url" content="https://www.partlycloudy.org/">
	<meta property="og:type" content="website">
	<meta property="og:image" content="https://www.partlycloudy.org/web-app-manifest-512x512.png">
	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="Simple Weather App">
	<meta name="twitter:description"
		content="A website which pulls the US NWS weather forecast for your location in a mobile friendly format.">
	<meta name="format-detection" content="telephone=no">
	<link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
	<link rel="preconnect" href="https://api.weather.gov" crossorigin>
	<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
	<link rel="preconnect" href="https://mapservices.weather.noaa.gov" crossorigin>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
